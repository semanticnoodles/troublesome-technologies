  repo-url: "https://github.com/semanticnoodles/troublesome-technologies"   # EDIT
  favicon: imgs/icon-tt.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: pil/strand-1-survey.qmd
        text: "Participant Information Leaflet (S1)"
          # - href: pil/strand-2-followup.qmd
          #   text: "Strand 2: Follow-up"
      - href: protocols/de-identification.qmd
        text: De-identification Protocol
      - href: contacts.qmd
        text: Contacts 
  page-footer: "This work is conducted with the financial support of Taighde Éireann – Research Ireland, under grant number 23/RC/13506 at the Research Ireland Centre – Rinn Artificial Intelligence."
    #right: "[Source on GitHub](https://github.com/semanticnoodles/troublesome-technologies)"   # EDIT

format:
